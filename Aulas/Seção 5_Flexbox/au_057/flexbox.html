<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title> Flexbox</title>
    <meta charset="UTF-8">
    <meta name="author" content="Guilherme França Fernandes">

    <style>
        body {
            background-color: bisque;
        }

        .flexbox {
            height: 250px;
            border: 3px solid red;
            display: flex;
            margin-bottom: 16px;
        }

        .flexbox div {
            border: 2px solid orange;
            width: 150px;
            margin: 15px;
        }

        .flex-container1 {
            /*flex-direction: row; 
            flex-wrap: wrap;*/
            flex-flow: row wrap;
        }

        .flex-container2 {
            /*
            justify-content: flex-start;
            justify-content: flex-end; 
            justify-content: center;
            justify-content: space-around;
            justify-content: space-between;
            */
            justify-content: stretch;
        }

        .flex-container2 div {
            width: 30px;
        }

        .flex-container3 {
            /* Horizontal */
            justify-content: space-around;
            /* Vertical */
            /*
            align-items: flex-start;
            align-items: flex-end;
            */
            align-items: center;
        }

        .flex-container3 div {
            width: 30px;
            margin: 0;
        }

        .flex-container4 {
            justify-content: space-around;
            align-items: baseline;
        }

        .flex-container4 div {
            width: 30px;
            margin: 0;
        }

        .flex-container5 {
            justify-content: center;
            /* align-items: flex-end; */
            align-content: stretch;
            flex-wrap: wrap;
        }

        .flex-container5 div{
            width: 100px;
        }

    </style>
</head>

<body>

    <div class="flexbox flex-container1">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

    <div class="flexbox flex-container2">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

    <div class="flexbox flex-container3">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

    <div class="flexbox flex-container4">
        <div class="div1">1</div>
        <div class="div2" style="font-size: 36px;">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

    <div class="flexbox flex-container5">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

</body>

</html>
